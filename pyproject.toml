[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "big-chicken-houdini-studio"
version = "0.1.0"
description = "A Codex-powered Houdini studio with durable scene operation receipts"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = []

[project.optional-dependencies]
ui = ["PySide6-Essentials==6.8.3"]
dev = ["ruff>=0.12,<1"]

[project.scripts]
big-chicken-studio = "studio.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 110
cache-dir = ".runtime/ruff"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
